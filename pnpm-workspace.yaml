packages:
  - 'apps/*'
  - 'packages/*'

# --- Install policy -------------------------------------------------------
# pnpm 11 reads settings from this file, not from .npmrc.

# Pin exact versions when adding dependencies so a stray `pnpm add` cannot
# silently widen a range past what was reviewed.
saveExact: true

# Resolve `@sakya/*` to local workspace packages instead of the registry.
linkWorkspacePackages: true
preferWorkspacePackages: true

# Reuse install artefacts between runs.
sideEffectsCache: true

# --- Approved lifecycle scripts -------------------------------------------
# pnpm blocks postinstall scripts by default. These are the only dependencies
# allowed to run them, and each one needs it:
#   prisma / @prisma/engines  -> download the schema-engine binary for migrate
#   @node-rs/argon2, esbuild, unrs-resolver -> native/JS build artefacts
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@node-rs/argon2': true
  prisma: true
  esbuild: true
  unrs-resolver: true
  '@sentry/cli': true

# --- Security overrides (transitive pins from `pnpm audit`) ----------------
# Patch/minor-level bumps only; each is verified by the full test suite after
# install. Major-version jumps (deepmerge-ts 8, uuid 11, basic-ftp 6) are NOT
# forced here — they only reach dev tooling (Prisma Studio, Expo CLI) and an
# override that breaks the CLI is worse than the advisory it fixes.
#   multer            2.2.0 -> 2.4.0   PRODUCTION: avatar upload (FileInterceptor)
#   js-yaml           4.3.1 -> 4.3.2   advisory GHSA CPU exhaustion
#   brace-expansion   5.0.9 -> 5.0.12  advisory stack exhaustion
#   fast-uri          3.1.7 -> 3.1.8   advisory host-case normalization
#   mysql2            3.15.3 -> 3.23.1 dev-only (Prisma CLI's bundled MySQL
#                                       driver; this platform runs PostgreSQL)
overrides:
  multer: 2.4.0
  js-yaml: 4.3.2
  brace-expansion: 5.0.12
  fast-uri: 3.1.8
  mysql2: 3.23.1

# zod 4.6.2 is deliberately pinned and was published inside the default
# minimum-release-age window; approving it here keeps the pin reproducible.
minimumReleaseAgeExclude:
  - zod@4.6.2
  - '@expo/cli@57.0.25'
  - '@expo/router-server@57.0.10'
  - babel-preset-expo@57.0.12
  - expo@57.0.23
  - expo-constants@57.0.19
  - expo-notifications@57.0.20
